<!DOCTYPE html>
<html>
<head>
    <title>Student Result</title>

    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
        }

        .box {
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            background: white;
        }

        input, button {
            width: 100%;
            padding: 10px;
            margin: 5px 0;
        }

        button {
            background: blue;
            color: white;
            border: none;
        }

        #result {
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="box">

    <h2>Student Result</h2>

    <input id="name" type="text" placeholder="Student Name">
    <input id="roll" type="text" placeholder="Roll Number">

   






 <input id="html" type="number" placeholder="HTML Marks">
    <input id="pst" type="number" placeholder="PST Marks">
    <input id="ads" type="number" placeholder="ADS Marks">

    <button onclick="showResult()">Show Result</button>

    <div id="result"></div>

</div>

<script>

function showResult() {

    let name = document.getElementById("name").value;
    let roll = document.getElementById("roll").value;

    let html = Number(document.getElementById("html").value);
    let pst = Number(document.getElementById("pst").value);
    let ads = Number(document.getElementById("ads").value);

    let total = html + pst + ads;
    let percentage = total / 3;

    let result;

    if (html >= 40 && pst >= 40 && ads >= 40) {
        result = "Pass";
    } else {
        result = "Fail";
    }

    document.getElementById("result").innerHTML =
        "<h3>Result</h3>" +
        "Name: " + name + "<br>" +
        "Roll Number: " + roll + "<br>" +
        "Total: " + total + "/300<br>" +
        "Percentage: " + percentage.toFixed(2) + "%<br>" +
        "Result: " + result;
}

</script>

</body>
</html>
