<html>

<head>

    <title>Student Registration Form</title>

    <style>
        h1 {
            text-align: center;
        }

        form {
            border: 1px solid black;
            width: 600px;
            margin-left: 500px;
            padding: 10px;
            background-color: rgb(135, 147, 157);
            border-radius: 15px;

            box-shadow: 5px 8px 20px black;
        }

        label {
            display: inline-block;
            width: 150px;
            margin-left: 110px;
            text-align: left;
        }
        
        #i1 {
            margin-left: 10px;
            height: 30px;
            
        }

        #i2 {
            margin-left: 10px;
        }

        #i3 {
            margin-left: 10px;
        }

        #i4 {
            margin-left: 10px;
        }

        #i5 {
            margin-left: 10px;
        }

        #i6 {
            margin-left: 10px;
        }

        #i7 {
            margin-left: 10px;
        }

        #i8 {
            margin-left: 10px;
        }

        #i9 {
            margin-left: 10px;
        }

        #i10 {
            margin-left: 10px;
        }

        #i11 {
            margin-left: 10px;
        }

        .gender-label {
            width: auto;
            margin-left: 5px;
        }

        #b1 {
            margin-left: 260px;
            width: 60px;
            height: 50px;
            background-color: aqua;
            text-align: center;
            border: none;
            border-radius: 10px;
        }

        #b2 {
            margin-left: 10px;
            width: 60px;
            height: 50px;
            background-color: red;
            border: none;
            border-radius: 10px;
        }

        #b1:hover {
            background-color: red;
        }

        #b2:hover {
            background-color: rgb(214, 196, 255);
        }

        ::placeholder {
            text-align: center;
        }
    </style>

</head>

<body>

    <form>

        <h1>Student Registration Form</h1>

        <label>Reg Id:</label>
        <input type="text" id="i1" placeholder="Enter your reg id" required>
        <br><br>

        <label>Student Name:</label>
        <input type="text" id="i2" placeholder="Enter student name" required>
        <br><br>

        <label>Gender:</label>

        <input type="radio" name="gender" id="male" value="Male" required>
        <label for="male" class="gender-label">Male</label>

        <input type="radio" name="gender" id="female" value="Female">
        <label for="female" class="gender-label">Female</label>

        <input type="radio" name="gender" id="other" value="Other">
        <label for="other" class="gender-label">Other</label>

        <br><br>

        <label>DOB:</label>
        <input type="date" id="i3" required>
        <br><br>

        <label>Email:</label>
        <input type="text" id="i4" placeholder="Enter your email">
        <br><br>

        <label>Mobile No:</label>
        <input type="text" id="i5" placeholder="Enter your mobile no" required>
        <br><br>

        <label>College:</label>
        <input type="text" id="i6" placeholder="Enter your college name" required>
        <br><br>

        <label>Department:</label>
        <input type="text" id="i7" placeholder="Enter your Department" required>
        <br><br>

        <label>Course:</label>
        <input type="text" id="i8" placeholder="Enter your course" required>
        <br><br>

        <label>Section:</label>
        <input type="text" id="i9" placeholder="Enter your section" required>
        <br><br>

        <label>Address:</label>
        <textarea rows="4" cols="20" id="i10" placeholder="Enter your permanent address" required></textarea>
        <br><br>

        <label>Resume:</label>
        <input type="file" id="i11" required>
        <br><br>

        <button id="b1" type="submit">Submit</button>
        <button id="b2" type="reset">Reset</button>

    </form>

</body>

</html>
