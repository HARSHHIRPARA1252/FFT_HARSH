<!DOCTYPE html>
<html>

<head>
    <title>DOM Methods</title>
</head>

<body>

    <h2 id="heading">Hello World</h2>

    <p name="para">Paragraph 1</p>
    <p name="para">Paragraph 2</p>

    <p class="text">Class 1</p>
    <p class="text">Class 2</p>

    <div>Div 1</div>
    <div>Div 2</div>

    <script>

        // 1. document.write()
        document.write("Hello from document.write()<br>");

        // 2. document.writeln()
        document.writeln("Hello from document.writeln()<br>");

        // 3. getElementById()
        document.getElementById("heading").innerHTML =
            "Changed by ID";

        // 4. getElementsByName()
        document.getElementsByName("para")[1].innerHTML =
            "Changed by Name";

        // 5. getElementsByClassName()
        document.getElementsByClassName("text")[1].innerHTML =
            "Changed by Class";

        // 6. getElementsByTagName()
        document.getElementsByTagName("div")[0].innerHTML =
            "Changed by Tag";

        // 7. querySelector()
        document.querySelector(".text").style.color =
            "red";

        // 8. querySelectorAll()
        document.querySelectorAll(".text")[1].style.color =
            "blue";

    </script>

</body>

</html>
