<html>

    <style>

        body {
            text-align: center;
            font-family: Arial, sans-serif;
            background-color: #eeeeee;
        }

        .parent {
            display: grid;
            grid-template-columns: repeat(8, 100px);
            width: 800px;
            margin: 30px auto;
            border: 8px solid grey;
        }

        .parent div {
            width: 100px;
            height: 100px;
            background-color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 65px;
        }

        .parent div.white {
            background-color: white;
        }

        .black-piece {
            color: black;
        }

        .coffee-piece {
            color: #8B4513;
        }

    </style>

</head>

<body>

</html>
